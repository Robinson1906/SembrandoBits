server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Archivos estáticos
    location /assets/ {
        try_files $uri =404;
    }

    # API proxy opcional (descomentar y ajustar si se sirve por mismo dominio)
    # location /api/ {
    #     proxy_pass http://backend:8860/; # nombre del servicio en docker-compose
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # }

    # Fallback para SPA (React Router)
    location / {
        try_files $uri /index.html;
    }
}
